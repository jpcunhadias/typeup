name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PANDOC_VERSION: "3.5"

jobs:
  check:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get install -y /tmp/pandoc.deb
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # TeX tests run in the render job
      - run: uv run pytest -m "not tex"

  render:
    name: Render the examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install pandoc and TeX Live
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends /tmp/pandoc.deb \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-plain-generic \
            lmodern fonts-lmodern fonts-texgyre latexmk poppler-utils
      - run: uv sync --locked
      - name: All tests, TeX included
        run: uv run pytest
      - name: Render the example notes
        run: make notes combined
      - name: No local paths in the PDFs
        run: |
          if grep -a -l -E '/home/|/Users/|file://' examples/*/notes/pdf/*.pdf; then
            echo "::error::a rendered PDF holds a local path"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: example-pdfs
          path: examples/*/notes/pdf/*.pdf
